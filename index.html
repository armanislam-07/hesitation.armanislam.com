<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hesitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <!-- =====================================================
       STICKY SCROLL / 3D HERO
  ====================================================== -->
  <section class="hero-scroll" id="hero">

    <div class="scene">

      <div class="background" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>

      <div class="word-wrap">
        <h1 class="word">HESITATION</h1>
      </div>

      <section class="model-stage" aria-label="Interactive 3D spacecraft">

        <div class="model-halo" aria-hidden="true"></div>

        <canvas id="three-canvas"></canvas>

        <div class="loading" id="loading">
          LOADING OBJECT
        </div>

        <div class="model-ui">
          <span class="model-ui-line"></span>
          MOVE CURSOR / DRAG TO EXPLORE
        </div>

      </section>

      <div class="hint">
        <span class="line"></span>scroll
      </div>

      <div class="grain" aria-hidden="true"></div>

    </div>

  </section>


  <!-- =====================================================
       PROJECT SUMMARY
  ====================================================== -->
  <section class="project-summary" id="project-summary">

    <div class="summary-image-wrap">
      <img
        class="summary-image"
        src="main.png"
        alt="Project hero image"
      />
    </div>

    <div class="summary-copy">

      <div class="eyebrow">
        PROJECT SUMMARY
      </div>

      <h2>
        HESITATION
      </h2>

      <p class="summary-lead">
        Creating a Nuclear Electric Propulsion (NEP) Testbed to mimic and research the SR-1 Missions.
      </p>

      <div class="summary-rule"></div>

      <div class="summary-grid">

        <div class="summary-item">
          <span>M1 / AUTONOMOUS REACTOR CONTROL</span>
          <p>
            Nov. 6 2027
          </p>
        </div>

        <div class="summary-item">
          <span>M2 / HIL INJECTIONS</span>
          <p>
            TBD
          </p>
        </div>

        <div class="summary-item">
          <span>M3 / ~</span>
          <p>
            TBD
          </p>
        </div>

      </div>

      <a class="summary-link" href="#hero">
        BACK TO TOP
        <span>↗</span>
      </a>

    </div>

  </section>


  <script type="module" src="script.js"></script>

</body>
</html>
